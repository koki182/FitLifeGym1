<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitLife Gym | Enquiry</title>
    <meta name="description" content="Contact FitLife Gym to ask questions about memberships, services and fitness programmes.">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            FitLife <span>Gym</span>
        </div>

        <!-- Navigation -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>


    <!-- Page heading -->
    <section class="page-heading">

        <h1>Make an <span>Enquiry</span></h1>

        <p>
            Interested in joining FitLife Gym? Send us a message.
        </p>

    </section>


    <!-- Enquiry form -->
    <section class="enquiry-section">
    <h2>Send Us an Enquiry</h2>

    <form id="enquiryForm">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" required>

        <label for="message">Your Message:</label>
        <textarea id="message" required></textarea>

        <button type="submit">Submit Enquiry</button>

        <p id="formMessage"></p>
    </form>
</section>


    <!-- Footer -->
    <footer>

        <p>&copy; 2026 FitLife Gym. All Rights Reserved.</p>

        <p>Your fitness. Your goals. Your journey.</p>

    </footer>
<script src="js/script.js"></script>
</body>

</html>
